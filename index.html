<!DOCTYPE html>
<html lang="vi" class="scroll-smooth"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="p_name"></title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html {
            /* Cách 1: Đẩy vị trí dừng của các Section xuống 120px để không bị che bởi Header */
            scroll-padding-top: 120px;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e2e8f0;
            background-image: linear-gradient(to bottom right, #f8fafc, #e2e8f0);
        }
        .section-title {
            position: relative;
            display: inline-block;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }
        .section-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60%;
            height: 4px;
            background-color: #6366f1;
            border-radius: 9999px;
        }
        .card-hover-effect {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover-effect:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }
        .experience-item {
            transition: background-color 0.3s ease;
        }
        .experience-item:hover {
            background-color: #f0f4f8; /* Light hover for experience items */
        }
        nav a { color: #4f46e5; } 

        /* Nếu thẻ html có lang="vi", thì nút VI sẽ có màu đỏ hoặc gạch chân */
        html[lang="vi"] a[onclick="renderList('vi')"] {
            color: #b91c1c; /* Đỏ */
            text-decoration: underline;
            font-weight: bold;
        }

        html[lang="en"] a[onclick="renderList('en')"] {
            color: #b91c1c;
            text-decoration: underline;
            font-weight: bold;
        }

        html[lang="ko"] a[onclick="renderList('ko')"] {
            color: #b91c1c;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body class="antialiased text-gray-800">
    <header id="main-header" class="sticky top-0 z-50 transition-all duration-300 w-full">
        <div id="header-inner" class="container mx-auto mt-4 px-4 sm:px-6 lg:px-10">
            <div class="bg-white/90 backdrop-blur-md shadow-2xl rounded-3xl p-6 flex flex-col md:flex-row items-center justify-between transition-all duration-300">
                <div class="flex flex-col md:flex-row items-center text-center md:text-left">
                    <img id="avatar" src="./assets/images/Avatar.jpg" alt="Ảnh đại diện" class="w-24 h-24 rounded-full object-cover mb-4 md:mb-0 md:mr-6 shadow-xl border-4 border-purple-400 ring-2 ring-purple-200 transition-all">
                    <div>
                        <h1 id="brand-name" class="text-2xl font-extrabold text-gray-900 leading-tight transition-all"  data-key="p_name"></h1>
                        <p id="brand-sub" class="text-sm text-gray-600 font-medium tracking-wide transition-all"  data-key="desc"></p>
                    </div>
                </div>
                <nav class="mt-6 md:mt-0">
                    <ul class="flex flex-wrap justify-center md:justify-end space-x-6">
                        <li><a href="#gioi-thieu" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" data-key="menu1"></a></li>
                        <li><a href="#ky-nang" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" data-key="menu2"></a></li>
                        <li><a href="#kinh-nghiem" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" data-key="menu3"></a></li>
                        <li><a href="#lien-he" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" data-key="menu4"></a></li>
                        <li>
                            <a href="javascript:void(0)" aria-current="page" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" onclick="renderList('vi')">VI</a> |
                            <a href="javascript:void(0)" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" onclick="renderList('en')">EN</a> |
                            <a href="javascript:void(0)" class="text-indigo-600 hover:text-indigo-800 font-semibold transition hover:underline hover:underline-offset-4" onclick="renderList('ko')">KO</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 sm:p-6 lg:p-10">
        <!-- Phần Giới Thiệu -->
        <section id="gioi-thieu" class="bg-white shadow-xl rounded-3xl p-8 mb-10 card-hover-effect">
            <h2 class="text-4xl font-bold text-gray-900 section-title" data-key="menu1"></h2>
            <p class="text-xl text-gray-700 leading-relaxed" data-key="interview">
            </p>
        </section>

        <!-- Phần Kỹ Năng -->
        <section id="ky-nang" class="bg-white shadow-xl rounded-3xl p-8 mb-10 card-hover-effect">
            <h2 class="text-4xl font-bold text-gray-900 section-title" data-key="menu2"></h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- Kỹ năng Phát triển Web -->
                <div class="bg-blue-50 p-6 rounded-xl shadow-md border border-blue-200 card-hover-effect">
                    <h3 class="text-2xl font-bold text-blue-700 mb-3 flex items-center"><svg class="w-7 h-7 mr-3 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l.649-.186.936-2.517 1.442.361.936 2.517.649.186a1 1 0 001.169-1.409l-7-14zM10 4.242L15.347 15.348 10 13.01l-5.347 2.338L10 4.242z"></path></svg><data  data-key="skill1"></data></h3>
                    <ul class="list-disc list-inside text-gray-700 space-y-2 text-lg" data-key="skill1_list">
                    </ul>
                </div>
                <!-- Kỹ năng Cơ sở dữ liệu -->
                <div class="bg-green-50 p-6 rounded-xl shadow-md border border-green-200 card-hover-effect">
                    <h3 class="text-2xl font-bold text-green-700 mb-3 flex items-center"><svg class="w-7 h-7 mr-3 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm0 2h12v8H4V6zm2 2h8v2H6V8zm0 4h8v2H6v-2z"></path></svg><data  data-key="skill2"></data></h3>
                    <ul class="list-disc list-inside text-gray-700 space-y-2 text-lg" data-key="skill2_list">
                    </ul>
                </div>
                <!-- Kỹ năng Công cụ & Khác -->
                <div class="bg-yellow-50 p-6 rounded-xl shadow-md border border-yellow-200 card-hover-effect">
                    <h3 class="text-2xl font-bold text-yellow-700 mb-3 flex items-center"><svg class="w-7 h-7 mr-3 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 102 0V8a1 1 0 00-.445-.832L10 6.5l-.445.668z"></path></svg><data  data-key="skill3"></data></h3>
                    <ul class="list-disc list-inside text-gray-700 space-y-2 text-lg" data-key="skill3_list">
                    </ul>
                </div>
            </div>
        </section>

        <!-- Phần Kinh Nghiệm -->
        <section id="kinh-nghiem" class="bg-white shadow-xl rounded-3xl p-8 mb-10 card-hover-effect">
            <h2 class="text-4xl font-bold text-gray-900 section-title" data-key="menu3"></h2>
            <div class="space-y-8">
                <!-- Kinh nghiệm 1 -->
                <div class="border-l-4 border-indigo-500 pl-6 py-2 experience-item rounded-r-lg">
                    <h3 class="text-3xl font-bold text-gray-900" data-key="exp1"></h3>
                    <p class="text-indigo-600 text-xl font-medium mb-2" data-key="exp1_location_time"></p>
                    <ul class="list-disc list-inside text-gray-700 mt-2 space-y-1 text-lg" data-key="exp1_list">
                    </ul>
                </div>
                <!-- Kinh nghiệm 2 -->
                <div class="border-l-4 border-emerald-500 pl-6 py-2 experience-item rounded-r-lg">
                    <h3 class="text-3xl font-bold text-gray-900" data-key="exp2"></h3>
                    <p class="text-emerald-600 text-xl font-medium mb-2" data-key="exp2_location_time"></p>
                    <ul class="list-disc list-inside text-gray-700 mt-2 space-y-1 text-lg" data-key="exp2_list">
                    </ul>
                </div>
                <!-- Kinh nghiệm 3 -->
                <div class="border-l-4 border-violet-500 pl-6 py-2 experience-item rounded-r-lg">
                    <h3 class="text-3xl font-bold text-gray-900" data-key="exp3"></h3>
                    <p class="text-emerald-600 text-xl font-medium mb-2" data-key="exp3_location_time"></p>
                    <ul class="list-disc list-inside text-gray-700 mt-2 space-y-1 text-lg" data-key="exp3_list">
                    </ul>
                </div>
            </div>
        </section>

        <!-- Phần Liên Hệ -->
        <section id="lien-he" class="bg-white shadow-xl rounded-3xl p-8 mb-10 card-hover-effect">
            <h2 class="text-4xl font-bold text-gray-900 section-title" data-key="menu1"></h2>
            <p class="text-xl text-gray-700 mb-6" data-key="contact_desc"></p>
            <ul class="space-y-4 text-xl text-gray-700">
                <li class="flex items-center">
                    <svg class="w-8 h-8 mr-3 text-blue-500" fill="currentColor" viewBox="0 0 20 20"><path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path><path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path></svg>
                    Email: <a href="mailto:ducduongblue@gmail.com" class="text-blue-600 hover:underline ml-2">ducduongblue@gmail.com</a>
                </li>
                <li class="flex items-center">
                    <svg class="w-8 h-8 mr-3 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7 2a2 2 0 00-2 2v12a2 2 0 002 2h6a2 2 0 002-2V4a2 2 0 00-2-2H7zm3 14a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"></path></svg>
                    Phone: <a href="tel:+84942896599" class="text-blue-600 hover:underline ml-2">(+84) 942 896 599</a>
                </li>
                <li class="flex items-center">
                    <svg class="w-8 h-8 mr-3 text-gray-600" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 0C4.477 0 0 4.484 0 10.017c0 4.417 2.865 8.168 6.839 9.489.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.004.072 1.531 1.032 1.531 1.032.892 1.529 2.341 1.089 2.91.833.091-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.93 0-1.09.39-1.984 1.029-2.682-.103-.253-.446-1.272.098-2.65 0 0 .84-.268 2.75 1.022A9.607 9.607 0 0110 4.878c.85.004 1.705.115 2.504.337 1.909-1.29 2.747-1.022 2.747-1.022.546 1.378.202 2.397.099 2.65.64.698 1.028 1.592 1.028 2.682 0 3.826-2.338 4.673-4.564 4.925.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.579.688.482C17.13 18.18 20 14.425 20 10.017 20 4.484 15.522 0 10 0z" clip-rule="evenodd"></path></svg>
                    GitHub: <a href="https://github.com/karbjs" target="_blank" class="text-blue-600 hover:underline ml-2">github.com/karbjs</a>
                </li>
            </ul>
        </section>

        <footer class="text-center text-gray-600 mt-10 py-6 border-t border-gray-300 text-lg">
            <p>&copy; <span id="year"></span> <data data-key="copyright"></data></p>
            <p class="mt-2 text-sm"><data data-key="copyright2"></data></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
